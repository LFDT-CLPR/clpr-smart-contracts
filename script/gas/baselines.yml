# Gas regression baselines (forge-based).
#
# Run:  npm run gas:check          (CI gate - fails if any metric increased)
#       npm run gas:check:update   (re-baseline to current measured values)
#
# A metric FAILS when  measured > baseline * (1 + tolerance_pct/100).
# Baselines are UPPER BOUNDS: optimizations that lower gas always pass; only
# increases fail. When a change is expected to move gas, re-baseline and review
# the diff to this file.
tolerance_pct: 0

# Metrics printed via console.log ("Label: <gas>") inside a forge test.
log_benchmarks:
  - name: Hiero verifier breakdown
    match_path: test/verifiers/hiero/GasUsage.t.sol
    metrics:
      # console.log label -> max allowed gas
      # Hiero decode/Merkle metrics raised by the #451 channel-binding fix: the ClprChannel
      # leaf's channel_id (proto field 1) is now decoded and bound, and a MerklePath's content
      # oneof is enforced; both the decode and the two Merkle walks in the breakdown test carry
      # that cost, and the shared-memory growth ripples into the later gasleft() deltas.
      "Protobuf decode": 177547
      "Merkle path 1": 1407829
      "Merkle path 2": 1195361
      "hinTS BLS12-381": 902672
      "WRAPS Groth16+KZG": 2456774
      "TOTAL": 6140183

  - name: Ethereum mainnet verifier (BLS / SSZ hot paths)
    match_path: test/verifiers/evm/ethereum/GasUsage.t.sol
    metrics:
      "hashToG2": 113934
      "BLS aggregateVerifyComplement 342 (170 nonP)": 1344779
      "BLS aggregateVerifyComplement 512 (0 nonP)": 218662
      "SSZ syncCommitteeRootFromUncompressed 512": 1136563

  - name: Tempo verifier (BLS hot paths and full calls)
    match_path: test/verifiers/tempo/TempoGasReport.t.sol
    metrics:
      "hashToG1": 26559
      "verifyMinSig (hashToG1 + pairing)": 131765
      "certified header, mainnet tip": 191961
      "verifyBundle steady state": 229289
      "verifyBundle, 1 rotation": 417228
      "verifyBundle, 2 rotations": 603624
      "verifyConfig": 219523

# End-to-end function gas from `forge test --gas-report`, keyed by contract +
# function + column (contract-aware: ClprService.submitBundle is distinct from
# BundleLogic.submitBundle). column ∈ {min, avg, median, max, calls}.
#
# Single-scenario metrics track the `min` column: a success-only test calls the
# function EXACTLY once on the happy path, so min == the real success-path cost.
# (The full HieroVerifier / QBFTVerifier suites also call verifyBundle on cheap
# early-revert paths, which is why those metrics point at dedicated gas files.)
gas_report_benchmarks:
  # TODO: test skipped until the real state-proof fixture regeneration work is done.
  #  - name: ClprService.submitBundle (Hiero, real state proof)
  #    match_path: test/logic/bundle-logic/HieroSubmitBundle.t.sol
  #    contract: ClprService
  #    function: submitBundle
  #    column: min
  #    baseline: 6439188
  # Raised by the #451 channel-binding fix: verifyBundle now decodes the ClprChannel leaf's
  # channel_id and binds it to channelContext (ClprHieroChannelMismatch).
  - name: HieroVerifier.verifyBundle (success-only path)
    match_path: test/verifiers/hiero/GasUsage.t.sol
    contract: HieroVerifier
    function: verifyBundle
    column: min
    baseline: 6115321
  - name: QbftHeaderModeVerifier.verifyBundle (success-only path)
    match_path: test/verifiers/evm/qbft/GasUsage.t.sol
    contract: QbftHeaderModeVerifier
    function: verifyBundle
    column: min
    baseline: 123232
  - name: QbftHeaderModeVerifier.verifyBundle (rotation 10 to 11)
    match_path: test/verifiers/evm/qbft/GasUsage.t.sol
    contract: QbftHeaderModeVerifier
    function: verifyBundle
    column: median
    baseline: 365095
  - name: QbftHeaderModeVerifier.verifyBundle (rotation 51 to 52)
    match_path: test/verifiers/evm/qbft/GasUsage.t.sol
    contract: QbftHeaderModeVerifier
    function: verifyBundle
    column: max
    baseline: 1233252
  - name: QbftHeaderModeVerifier.verifyConfig (success-only path)
    match_path: test/verifiers/evm/qbft/GasUsage.t.sol
    contract: QbftHeaderModeVerifier
    function: verifyConfig
    column: min
    baseline: 107457
  # QBFT Contract mode, calling verifier directly
  - name: QbftContractModeVerifier.verifyBundle (steady state)
    match_path: test/verifiers/evm/qbft/ContractModeGasUsage.t.sol
    contract: QbftContractModeVerifier
    function: verifyBundle
    column: min
    baseline: 218259
  - name: QbftContractModeVerifier.verifyBundle (rotation 10 to 11)
    match_path: test/verifiers/evm/qbft/ContractModeGasUsage.t.sol
    contract: QbftContractModeVerifier
    function: verifyBundle
    column: median
    baseline: 690010
  - name: QbftContractModeVerifier.verifyBundle (rotation 51 to 52)
    match_path: test/verifiers/evm/qbft/ContractModeGasUsage.t.sol
    contract: QbftContractModeVerifier
    function: verifyBundle
    column: max
    baseline: 3202023
  - name: QbftContractModeVerifier.verifyConfig (success-only path)
    match_path: test/verifiers/evm/qbft/ContractModeGasUsage.t.sol
    contract: QbftContractModeVerifier
    function: verifyConfig
    column: min
    baseline: 182930
  # Tempo, calling verifier directly
  - name: TempoVerifier.verifyBundle (steady state)
    match_path: test/verifiers/tempo/TempoGasUsage.t.sol
    contract: TempoVerifier
    function: verifyBundle
    column: min
    baseline: 229289
  - name: TempoVerifier.verifyBundle (1 rotation)
    match_path: test/verifiers/tempo/TempoGasUsage.t.sol
    contract: TempoVerifier
    function: verifyBundle
    column: max
    baseline: 417228
  - name: TempoVerifier.verifyConfig (success-only path)
    match_path: test/verifiers/tempo/TempoGasUsage.t.sol
    contract: TempoVerifier
    function: verifyConfig
    column: min
    baseline: 219523
