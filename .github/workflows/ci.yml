name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: forge fmt, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Format
        run: forge fmt --check
      - name: Contract size limits (EIP-170 / EIP-3860, deployable contracts only)
        run: forge build --sizes --skip 'test/**' --skip 'script/**'
      - name: Test
        run: forge test
